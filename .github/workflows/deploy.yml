name: Deploy Swing5 to GitHub Pages

on:
  push:
    branches: [main]
  # 美股收盤後自動更新數據並重新部署（週一至五 22:30 UTC）
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 抓取最新日線/小時線數據（失敗自動重試，Yahoo 偶爾限流）
      - name: Fetch latest market data
        run: |
          for i in 1 2 3; do
            python scripts/fetch_real.py && break
            echo "retry $i after 30s"; sleep 30
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
